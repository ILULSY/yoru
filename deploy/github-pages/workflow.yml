# MODÈLE — publication automatique de la vitrine sur GitHub Pages.
# Pour l'activer : 1) autoriser le droit « workflow » (gh auth refresh -s workflow),
# 2) déplacer ce fichier dans .github/workflows/, 3) dans Settings → Pages, choisir
# « Source : GitHub Actions ». En attendant, la vitrine se publie avec « npm run publier ».
#
# Construite à chaque envoi sur main, et toutes les 3 heures pour rafraîchir le
# fil d'actualités et le taux de change. Voir deploy/github-pages/prepare.mjs.
name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Retirer ce qui demande un serveur
        run: node deploy/github-pages/prepare.mjs

      - name: Adresse du site
        id: pages
        uses: actions/configure-pages@v5

      - name: Construire la version statique
        run: npx next build
        env:
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
